{% load static %}<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}ConnectHub{% endblock %}</title><link rel="stylesheet" href="{% static 'social/style.css' %}"></head><body><header class="top"><a class="logo" href="{% url 'feed' %}"><i>c</i> connecthub</a>{% if user.is_authenticated %}<form action="{% url 'explore' %}" class="search"><input name="q" placeholder="Search people and moments..." value="{{ query|default:'' }}"></form><nav><a href="{% url 'feed' %}">⌂</a><a href="{% url 'explore' %}">◎</a><a href="{% url 'create_post' %}">＋</a><a href="{% url 'profile' user.username %}">♙</a><form method="post" action="{% url 'logout' %}">{% csrf_token %}<button>↗</button></form></nav>{% endif %}</header><main>{% for message in messages %}<div class="flash">{{ message }}</div>{% endfor %}{% block content %}{% endblock %}</main><footer>Made for your moments <b>✦</b></footer></body></html>
